# deepeco.conf — regime de preços por horário da API DeepSeek
# Instalado em ~/.config/aula-dev/deepeco.conf — lido pelo `deepeco` (.sh e .ps1).
# Formato: CHAVE="valor" (ou 'valor'), UMA linha por chave.
#
# Regime EM VIGOR desde 16/08/2026 16:00 UTC (fontes oficiais
# api-docs.deepseek.com; tarifas reconferidas célula a célula em 17/08/2026,
# batem 1:1 com a tabela de /quick_start/pricing):
#   · PICO (preço 2×): 01:00–04:00 e 06:00–10:00 UTC
#     (= 22:00–01:00 e 03:00–07:00 no Brasil/UTC-3).
#   · ECONOMIA: todas as outras 17h do dia — metade do preço de pico,
#     desconto uniforme para todos os modelos.
#
# ⚠️ ECO_PICOS_UTC deve listar as janelas em ORDEM CRONOLÓGICA (o deepeco
#    deriva os intervalos de economia do fim de um pico ao início do próximo).
# ⚠️ Valores de tarifa em ASCII puro (a tabela alinha colunas por contagem
#    de caracteres).

ECO_ATIVO="1"
ECO_PICOS_UTC="01:00-04:00 06:00-10:00"
ECO_DESCONTO_LABEL="economia = metade do preço de pico (50% off, todos os modelos)"
ECO_PRECO_FLASH_ECONOMIA='$0.007 / $0.22 / $0.66'
ECO_PRECO_PRO_ECONOMIA='$0.022 / $0.66 / $1.98'
ECO_PRECO_FLASH_PICO='$0.014 / $0.44 / $1.32'
ECO_PRECO_PRO_PICO='$0.044 / $1.32 / $3.96'
ECO_FONTE="https://api-docs.deepseek.com/quick_start/pricing/"
